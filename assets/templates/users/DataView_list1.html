{% extends 'userbase.html'%}
{%block contents%}

 <section id="intro">

    <div class="intro-text">
<br><br><br><br><br><br><br><br><br><br><br><br><br><br>
      <p><h2>Data View</h2></p>
      
<style>
  html, body {
    height:100%;
    background-color: #666699;
  }
  
  .well {
    background-color: #ffffee
  }
  
  #content {
    padding: 25% 25% 5%;  
  }
  
  .search-form {
    border-radius: 30px 0 0 30px;
  }
  
  .input-group {
    width:100%;
  }
  
  input-group-btn {
    max-width:38px;
  }
  
  #search {
    border: 1px;
  }
  
  .search-btn {
    cursor:pointer;
    border-radius: 0 30px 30px 0; 
    background-color:#fff;
    color:#669;
    
  }
  
  .text-center {
    color: #fff;
  }
</style>
<div class="container">
  <div id="">
    <form method ='POST' action="{%url 'idsearch' %}">
      {% csrf_token %}
      <div class="input-group">
        <input type="text" class="form-control" name="email" placeholder="Search for...">
        <span class="input-group-btn">
          <button class="btn btn-default search-btn" type="submit"><span class="glyphicon glyphicon-search"></span></button>
        </span>
      </div>
      </form>
      </div>
      <br>
</center>
    </div>
  </section>
{%endblock%}
